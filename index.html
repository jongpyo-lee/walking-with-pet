<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경주 댕댕산책 - 반려견 맞춤 코스 추천</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 상단 헤더 -->
    <header class="app-header">
      <h1>🐾 경주 댕댕산책</h1>
      <button id="btn-custom-course" class="btn-secondary">+ 코스 만들기</button>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="main-container">
      <!-- 좌측: 필터 및 설정 패널 -->
      <aside class="sidebar">
        <section class="panel-section">
          <h2>1. 출발지 설정</h2>
          <div class="search-box">
            <input type="text" id="input-address" placeholder="주소(도로명/지번) 또는 장소 입력">
            <button id="btn-search">검색</button>
          </div>
          <button id="btn-gps" class="btn-gps">📍 현재 위치로 설정</button>
        </section>

        <section class="panel-section">
          <h2>2. 산책 유형</h2>
          <div class="toggle-group">
            <button class="btn-toggle active" data-type="loop">🔄 왕복 (제자리 복귀)</button>
            <button class="btn-toggle" data-type="oneway">➡️ 편도 (목적지 이동)</button>
          </div>
        </section>

        <section class="panel-section">
          <h2>3. 산책 목표</h2>
          <div class="target-group">
            <span class="target-label">거리 선택</span>
            <div class="chip-group" id="chip-distance">
              <button class="chip" data-val="1">1km</button>
              <button class="chip active" data-val="3">3km</button>
              <button class="chip" data-val="5">5km</button>
              <button class="chip" data-val="10">10km</button>
              <button class="chip" data-val="15">15km+</button>
            </div>
          </div>
        </section>

        <section class="panel-section">
          <h2>4. 보행 환경 범례</h2>
          <div class="legend-list">
            <div class="legend-item"><span class="color-dot safe"></span> 인도 전용 / 안전 구간</div>
            <div class="legend-item"><span class="color-dot warning"></span> 차도 혼용 / 골목길 주의</div>
          </div>
        </section>

        <button id="btn-find-course" class="btn-primary">맞춤 산책 코스 찾기</button>
      </aside>

      <!-- 우측: 지도 및 결과 출력 지도 영역 -->
      <section class="map-container">
        <div id="map-placeholder">
          <div class="map-mock-info">
            <p>📍 <strong>지도 뷰포트</strong></p>
            <p id="map-status-text">출발지와 목표를 선택한 후 코스를 검색하세요.</p>
          </div>
        </div>

        <!-- 하단 결과 스와이프/카드 영역 -->
        <div class="course-results" id="course-results">
          <!-- JS로 카드가 동적 생성됩니다 -->
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
