<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경주 댕댕산책 - 반려견 맞춤 코스 추천</title>
  
  <!-- Leaflet 지도 라이브러리 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 상단 헤더 -->
    <header class="app-header">
      <h1>🐾 경주 댕댕산책</h1>
      <button id="btn-custom-course" class="btn-secondary">+ 코스 만들기</button>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="main-container">
      <!-- 좌측: 설정 패널 -->
      <aside class="sidebar">
        <section class="panel-section">
          <h2>1. 출발지 설정</h2>
          <div class="search-box">
            <input type="text" id="input-address" placeholder="예: 황남동, 첨성로 140">
            <button id="btn-search">검색</button>
          </div>
          <button id="btn-gps" class="btn-gps">📍 현재 위치로 설정</button>
        </section>

        <section class="panel-section">
          <h2>2. 산책 유형</h2>
          <div class="toggle-group">
            <button class="btn-toggle active" data-type="loop">🔄 왕복 (제자리 복귀)</button>
            <button class="btn-toggle" data-type="oneway">➡️ 편도 (목적지 이동)</button>
          </div>
        </section>

        <section class="panel-section">
          <h2>3. 산책 목표</h2>
          <div class="target-group">
            <span class="target-label">거리 선택</span>
            <div class="chip-group" id="chip-distance">
              <button class="chip" data-val="1">1km</button>
              <button class="chip active" data-val="3">3km</button>
              <button class="chip" data-val="5">5km</button>
              <button class="chip" data-val="10">10km</button>
              <button class="chip" data-val="15">15km+</button>
            </div>
          </div>
        </section>

        <section class="panel-section">
          <h2>4. 보행 환경 범례</h2>
          <div class="legend-list">
            <div class="legend-item"><span class="color-dot safe"></span> 인도 전용 / 안전 구간 (초록 실선)</div>
            <div class="legend-item"><span class="color-dot warning"></span> 차도 혼용 / 주의 구간 (주황 점선)</div>
          </div>
        </section>

        <button id="btn-find-course" class="btn-primary">맞춤 산책 코스 찾기</button>
      </aside>

      <!-- 우측: 지도 영역 -->
      <section class="map-container">
        <div id="map"></div>
        <div class="course-results" id="course-results"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
