<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경주 멍멍 산책 - 반려견 산책 코스 추천</title>
    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet 지도 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <header>🐾 경주 멍멍 산책 코스 추천</header>

    <div class="container">
        <!-- 지도 영역 -->
        <div class="card">
            <h2>🗺️ 경주 실제 인도/산책로 지도</h2>
            <div id="map"></div>
        </div>

        <!-- 1. 위치 및 목표 설정 -->
        <div class="card">
            <h2>📍 산책 설정</h2>
            <label for="locationInput">현위치 또는 주소 검색 (경주시)</label>
            <div class="search-box">
                <input type="text" id="locationInput" placeholder="예: 황성공원, 보문호수, 첨성로">
                <button class="btn" onclick="searchLocation()">검색</button>
            </div>
            <button class="btn gps-btn" onclick="getCurrentLocation()">현재 내 위치 가져오기</button>

            <label for="goalSelect">목표 설정</label>
            <select id="goalSelect">
                <option value="30분">30분 산책 (황성공원 솔숲 코스)</option>
                <option value="1시간">1시간 산책 (보문호수 수변길)</option>
                <option value="3km">3km 거리 (형산강 강변 인도)</option>
                <option value="5km">5km 거리 (대릉원/돌담길 코스)</option>
            </select>
            <button class="btn" onclick="recommendCourses()">실제 인도 코스 지도에 표시</button>
        </div>

        <!-- 2. 추천 코스 리스트 -->
        <div class="card">
            <h2>✨ 추천 산책 코스</h2>
            <div id="courseList">
                <p class="placeholder-text">위치와 목표를 설정하고 추천을 받아보세요!</p>
            </div>
        </div>

        <!-- 3. 나만의 코스 만들기 -->
        <div class="card">
            <h2>🛠️ 나만의 산책 코스 만들기</h2>
            <label for="customTitle">코스 이름</label>
            <input type="text" id="customTitle" placeholder="예: 우리 동네 숨은 산책로">
            
            <label for="customDesc">코스 설명 및 경유지</label>
            <input type="text" id="customDesc" placeholder="예: 출발지 -> 공원 한 바퀴 -> 카페 앞">

            <button class="btn custom-btn" onclick="saveCustomCourse()">내 코스로 등록하기</button>
        </div>

        <!-- 4. 산책 후 기록/저장 -->
        <div class="card">
            <h2>📝 산책 일지 기록</h2>
            <label for="recordDate">산책 날짜</label>
            <input type="date" id="recordDate">

            <label for="recordMemo">반려견과의 산책 소감 및 메모</label>
            <input type="text" id="recordMemo" placeholder="예: 날씨가 좋아서 댕이가 아주 좋아했어요!">

            <button class="btn record-btn" onclick="saveWalkRecord()">기록 저장하기</button>

            <h3 class="history-title">나의 산책 히스토리</h3>
            <div id="recordList">
                <p class="placeholder-text">저장된 산책 기록이 없습니다.</p>
            </div>
        </div>
    </div>

    <!-- Leaflet 지도 JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- JavaScript 파일 연결 -->
    <script src="script.js"></script>
</body>
</html>
